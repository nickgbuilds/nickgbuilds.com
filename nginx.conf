server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # NOTE ON add_header INHERITANCE
    # nginx inherits add_header directives from an outer block ONLY if the
    # inner block declares none of its own. Both location blocks below set
    # their own Cache-Control, so anything declared only at server level would
    # be silently dropped for them. The security headers are therefore
    # repeated in every location that sets a header. Do not "tidy" them up
    # into a single server-level block -- that is the bug this replaced.

    # Security headers (server level: applies to locations that set no headers
    # of their own, e.g. the internal /404.html)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "0" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml;

    # Static assets with long cache
    location ~* \.(css|js|jpg|jpeg|png|gif|svg|webp|woff2?|ttf|ico)$ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-XSS-Protection "0" always;

        # Single Cache-Control header; `expires` would emit a second one.
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # HTML pages: short cache, revalidate
    location / {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-XSS-Protection "0" always;

        try_files $uri $uri/ $uri.html =404;
        add_header Cache-Control "public, max-age=3600, must-revalidate" always;
    }

    # Custom 404
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
